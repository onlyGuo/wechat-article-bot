<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>默认公众号风格样张</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;color:#333333;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;line-height:1.9;">
<main style="max-width:36rem;margin:0 auto;padding:2.25rem 1.25rem 4rem;">
  <header style="margin:0 0 30px 0;">
    <p style="margin:0 0 10px 0;color:#07C160;font-size:14px;font-weight:600;letter-spacing:0.12em;">DEFAULT · ARTICLE</p>
    <h1 style="margin:0 0 16px 0;color:#222222;font-size:28px;font-weight:700;line-height:1.45;">把复杂问题讲清楚</h1>
    <blockquote style="margin:0;padding:0 0 0 14px;border-left:3px solid #07C160;color:#888888;font-size:15px;line-height:1.8;">好的公众号文章先给读者方向，再一步步说明为什么。</blockquote>
  </header>
  <p style="margin:0 0 16px 0;color:#333333;font-size:16px;line-height:1.9;text-align:justify;">这套默认版式不追求强烈装饰，而是用稳定的字号、段距和章节节奏，让不同主题都能自然阅读。</p>
  <section style="margin:42px 0 28px 0;text-align:center;">
    <p style="margin:0;color:#07C160;font-size:20px;line-height:1.2;">01</p>
    <section style="width:18px;height:2px;margin:7px auto 16px auto;background:#07C160;"></section>
    <h2 style="margin:0;color:#222222;font-size:20px;font-weight:400;line-height:1.6;text-align:center;">先给出判断</h2>
  </section>
  <p style="margin:0 0 16px 0;color:#333333;font-size:16px;line-height:1.9;text-align:justify;">标题和开篇回答“这件事为什么值得看”。正文随后补充背景、证据和限制，不用悬念拖延核心信息。</p>
  <section style="margin:42px 0 28px 0;text-align:center;">
    <p style="margin:0;color:#07C160;font-size:20px;line-height:1.2;">02</p>
    <section style="width:18px;height:2px;margin:7px auto 16px auto;background:#07C160;"></section>
    <h2 style="margin:0;color:#222222;font-size:20px;font-weight:400;line-height:1.6;text-align:center;">每章推进一步</h2>
  </section>
  <p style="margin:0 0 16px 0;color:#333333;font-size:16px;line-height:1.9;text-align:justify;">章节不是装饰。每个章节都要回答一个新问题，并通过自然段把读者带到下一步。</p>
  <aside style="margin:24px 0;padding:18px 20px;background:#f6fbf8;border-left:4px solid #07C160;">
    <p style="margin:0;color:#555555;font-size:15px;line-height:1.8;">版式越稳定，内容越容易被看见。</p>
  </aside>
  <footer style="margin:48px 0 20px 0;text-align:center;">
    <p style="margin:0;color:#999999;font-size:14px;line-height:1.8;">先说清楚，再说漂亮。</p>
  </footer>
</main>
</body>
</html>
